name: Build ChunkVault

on:
  push:
    branches: [ "26.2" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # No committed Gradle wrapper (built offline, couldn't fetch the wrapper
      # jar) — this action provisions Gradle itself and caches it.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'
          cache-read-only: false

      - name: Build mod
        run: gradle build --stacktrace

      - name: Upload built jar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chunkvault-jar
          path: build/libs/*.jar
          if-no-files-found: warn

      - name: Upload full build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: build/reports/
          if-no-files-found: ignore
