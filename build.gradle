plugins {
    id 'fabric-loom' version '1.17-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

// Gradle 8.x can't run/compile against Java 25 (class file major version 69);
// Gradle 9.6.1+ added the necessary toolchain support. If your GitHub Actions
// runner pulls an older wrapper, bump gradle/wrapper/gradle-wrapper.properties.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // No mappings() call on purpose: Minecraft ships fully unobfuscated
    // starting with 26.1, so there's no separate Mojang-mappings file to
    // fetch and nothing to remap — the client jar already uses the real
    // (official) class/method names. Loom 1.15+ detects this automatically.
    // (Adding loom.officialMojangMappings() here is what caused the
    // "Failed to find official mojang mappings for 26.2" build failure —
    // that layer is for pre-26.1 obfuscated versions only.)

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

jar {
    from("LICENSE") {
        rename { "${it}_${archivesName}" }
    }
}
